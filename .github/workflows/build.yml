name: Build & Test

on:
  release:
    types: [published]

  pull_request:
    branches:
      - "trunk"

  push:
    branches:
      - "trunk"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CONTRIBUTORS_TOKEN: ${{ secrets.CONTRIBUTORS_TOKEN }}
  IS_CI: true
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_PUBLISH_TOKEN }}

jobs:
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: Publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # - name: Verify crate
      #   run: cargo publish --dry-run

      # - name: Check version matches tag
      #   run: |
      #     $version = (cargo metadata --format-version 1 | ConvertFrom-Json).packages[0].version
      #     $tag = "${{ github.ref_name }}"
      #     if ($tag -ne "v$version") {
      #       throw "Version mismatch: tag=$tag, Cargo.toml=$version"
      #     }

      - name: Publish to crates.io
        if: ${{ !github.event.release.prerelease }}
        run: cargo publish
        continue-on-error: true

      - name: Build and Package
        if: ${{ !github.event.release.prerelease }}
        run: just release-all

      - name: Beta Build and Package
        if: ${{ github.event.release.prerelease }}
        run: just beta-release-all

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: package.zip
          path: release/*

      - name: Upload & Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.exe.sha256

      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@v5
        with:
          update_release_body: true
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            .exe$
